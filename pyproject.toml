[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "litjev"
version = "0.1.0"
description = "(Unofficial) Turn any off-the-shelf LLM into a JEV-like decision layer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES/*.txt"]
authors = [{ name = "ZhengxuYu" }]
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.10.0",
  "fastapi>=0.116.0",
  "numpy>=2.0.0",
  "pillow>=10.4.0",
  "pydantic>=2.11.0",
  "safetensors>=0.6.0",
  "torch==2.11.0",
  "torchvision>=0.26.0",
  "transformers>=5.17.0",
  "datasets>=3.0",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
games = ["gymnasium>=1.1.1", "chess>=1.11.2", "vizdoom>=1.2.4"]
# Answers that are expressions cannot be compared as strings: \frac{3}{4}, 3/4
# and 0.75 are one answer. Needed for math-500, not for the integer benchmarks.
maths = ["math-verify>=0.5"]
dev = [
  "httpx>=0.28.0",
  # The driver only, pinned to what browsergym-core pins. `playwright install` is
  # **not** needed and no browser is downloaded: tests/test_browser_driver.py
  # starts and stops the driver process and nothing else, in about a second.
  # It is here because without it that module skips, and the module is what caught
  # a defect that would have crashed every gate run at episode 26 -- a test that
  # only runs on the machine of whoever remembers to install something is a test
  # CI does not have.
  "playwright==1.44",
  "pytest>=8.4.0",
  # Exact. A floating linter changes what CI reports without anyone editing
  # anything: `ruff>=0.12` resolved to a release whose defaults had widened, and
  # `ruff check .` failed for forty pushes on code it had passed. The rule set is
  # stated in [tool.ruff.lint] for the same reason; what a stated rule reports
  # still drifts between versions, so the version is fixed too.
  "ruff==0.16.8",
]

[project.urls]
Repository = "https://github.com/zhengxuyu/litjev"
Issues = "https://github.com/zhengxuyu/litjev/issues"

[project.scripts]
litjev = "litjev.cli:serve"
litjev-serve = "litjev.cli:serve"
litjev-mmlu = "litjev.cli:mmlu"
litjev-calibrate = "litjev.cli:calibrate"
litjev-collect = "litjev.cli:collect"
litjev-train-head = "litjev.cli:train_head"
litjev-bench-routing = "litjev.cli:bench_routing"
litjev-datasets = "litjev.cli:datasets_manifest"
litjev-play = "litjev.games.cli:play"
litjev-film = "litjev.games.cli:film"

[tool.hatch.build.targets.wheel]
# inference/ is a package of its own rather than litjev.inference: it pulls in
# SGLang, which litjev deliberately does not depend on, so a deployment that
# serves through transformers never has to install it.
packages = ["src/litjev", "src/inference", "src/slime_htm"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/examples", "/docs", "/scripts",
  "/README.md", "/CONTRIBUTING.md", "/SECURITY.md",
  "/pyproject.toml", "/uv.lock", "/LICENSE", "/NOTICE", "/CITATION.cff",
  "/THIRD_PARTY_LICENSES", "/THIRD_PARTY_NOTICES.md",
]
exclude = ["**/node_modules", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Stated rather than left to ruff's defaults, which have widened since this was
# written: `ruff>=0.12` floats, and a newer release added rules nobody here
# chose, so `ruff check .` started failing on code it had passed. This is the
# set the repository was written against. Adding to it is a decision to make on
# purpose, not one to inherit from a release.
#
# F811, which F carries, is the one worth naming: a redefinition has twice
# silently won over the definition above it here, when an edit anchored on a
# name that occurs more than once left the old block below the new one. Both
# times the tests passed and a reader found it.
select = ["E4", "E7", "E9", "F", "SIM115", "RUF034", "BLE001", "I001"]
# Added after a floating ruff reported them and they were ruled on one at a time,
# rather than adopted because a release turned them on. SIM115 is here for the
# result files the paper reads: a killed `json.dump(x, open(p, "w"))` leaves a
# truncated file under the final name, which reads as a result. C408 was
# considered and skipped as style.

[tool.ruff.lint.per-file-ignores]
# E402 is the point in both: the import cannot move above what precedes it.
# test_games skips the module when gymnasium or chess is absent, and importing
# them above the skip would raise instead of skipping. alf_smoke sets
# ALFWORLD_DATA, which alfworld reads at import.
"tests/test_games.py" = ["E402"]
"scripts/alf_smoke.py" = ["E402"]

# Cluster driver 570 supports CUDA 12.8; do not select CUDA 13 wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
